name: Feature request
description: Suggest a command or behaviour for Surf
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed command or behaviour
      description: Show it as console input if you can.
      placeholder: "C:\\Web> ..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: searched
    attributes:
      label: Before you submit
      options:
        - label: I searched existing issues
          required: true
